name: Overture test (Plzeň)
on:
  push:
    branches: [overture-test]
    paths: [test/overture.py, .github/workflows/overture-test.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb
      - run: python3 test/overture.py
      - name: Uložit výsledek
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add test/overture_plzen.csv
          git commit -m "Overture Plzeň $(date -u +%Y-%m-%d)" || echo "beze změny"
          git push
