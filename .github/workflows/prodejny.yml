name: Prodejny z mapy

# Jednou měsíčně stáhne výřez mapy Česka (Geofabrik, data OpenStreetMap), místa z Overture Maps a registr provozoven
# a připraví z nich balík prodejen pro Akviziční mapu. Ručně: Actions → Prodejny z mapy → Run workflow.
on:
  schedule:
    - cron: '41 3 2 * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Jen zkouška: balík se nezveřejní, uloží se do větve (pro kontrolu)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  balik:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Nástroje
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install osmium duckdb pyproj

      - name: Stáhnout mapu Česka
        run: curl -fsSL --retry 3 -A "akvizice-prodejny (github.com/${{ github.repository }})" -o cz.osm.pbf https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf

      # další zdroje: když některý selže, balík se postaví bez něj (jako dřív jen z OpenStreetMap)
      - name: Overture Maps
        continue-on-error: true
        run: python3 zdroje.py overture zdroje

      - name: Registr provozoven
        continue-on-error: true
        run: python3 zdroje.py registr zdroje

      - name: Vybrat prodejny
        run: |
          python3 build.py filtr typy.txt > filtr.txt
          cat filtr.txt
          osmium tags-filter cz.osm.pbf -e filtr.txt -o prodejny.osm.pbf --overwrite
          mkdir -p zdroje
          python3 build.py balik prodejny.osm.pbf typy.txt out zdroje

      - name: Zveřejnit
        if: ${{ !inputs.test }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Prodejny z mapy" --notes "Balík prodejen pro Akviziční mapu. Data © přispěvatelé OpenStreetMap (ODbL 1.0), Overture Maps Foundation (CDLA Permissive 2.0 / Apache 2.0), Registr osob, RÚIAN, RES."
          gh release upload data out/prodejny.zip --clobber
          gh release upload data out/meta.json --clobber

      # zápis do repozitáře: GitHub jinak po 60 dnech bez změn naplánované spouštění vypne
      - name: Zapsat poslední běh
        if: ${{ !inputs.test }}
        run: |
          cp out/meta.json posledni.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add posledni.json
          git commit -m "Prodejny $(date -u +%Y-%m-%d)" || echo "beze změny"
          git push

      - name: Zkouška – uložit balík do větve
        if: ${{ inputs.test }}
        run: |
          mkdir -p zkouska && cp out/prodejny.zip out/meta.json zkouska/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add zkouska
          git commit -m "Zkouška balíku $(date -u +%Y-%m-%d)" || echo "beze změny"
          git push
