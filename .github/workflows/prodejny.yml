name: Prodejny z mapy

# Jednou měsíčně stáhne výřez mapy Česka (Geofabrik, data OpenStreetMap), místa z Overture Maps a Foursquare a registr provozoven
# a připraví z nich balík prodejen pro Akviziční mapu. Ručně: Actions → Prodejny z mapy → Run workflow.
on:
  schedule:
    - cron: '41 3 2 * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Jen zkouška: balík se nezveřejní, uloží se do větve (pro kontrolu)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  balik:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Nástroje
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install osmium duckdb pyproj cryptography

      - name: Stáhnout mapu Česka
        run: curl -fsSL --retry 3 -A "akvizice-prodejny (github.com/${{ github.repository }})" -o cz.osm.pbf https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf

      # další zdroje: když některý selže, balík se postaví bez něj (jako dřív jen z OpenStreetMap)
      - name: Overture Maps
        continue-on-error: true
        run: python3 zdroje.py overture zdroje

      # Foursquare OS Places (zdarma, Apache 2.0): pozná zavřená místa. Potřebuje tajemství HF_TOKEN – bez něj se krok přeskočí.
      - name: Foursquare
        continue-on-error: true
        timeout-minutes: 60
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 zdroje.py foursquare zdroje

      - name: Registr provozoven
        continue-on-error: true
        run: python3 zdroje.py registr zdroje

      - name: Vybrat prodejny
        run: |
          python3 build.py filtr typy.txt > filtr.txt
          cat filtr.txt
          osmium tags-filter cz.osm.pbf -e filtr.txt -o prodejny.osm.pbf --overwrite
          mkdir -p zdroje
          python3 build.py balik prodejny.osm.pbf typy.txt out zdroje

      # Hotový registr firem pro aplikaci (dřív si ho každá aplikace stavěla sama na hostingu). Bere soubory stažené
      # v kroku „Registr provozoven“ (složka stazene/), co chybí, stáhne. Zašifruje se klíčem BALIK_KLIC – bez tajemství
      # se krok přeskočí a aplikace si registr staví sama jako dřív. Když selže, prodejny se zveřejní i tak.
      - name: Registr firem
        continue-on-error: true
        timeout-minutes: 60
        env:
          BALIK_KLIC: ${{ secrets.BALIK_KLIC }}
        run: python3 registr.py postav stazene out-registr

      - name: Zveřejnit
        if: ${{ !inputs.test }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Prodejny z mapy" --notes "Balík prodejen pro Akviziční mapu. Data © přispěvatelé OpenStreetMap (ODbL 1.0), Overture Maps Foundation (CDLA Permissive 2.0 / Apache 2.0), Foursquare OS Places (Apache 2.0, viz NOTICE-foursquare.txt), Registr osob, RÚIAN, RES."
          gh release upload data out/prodejny.zip --clobber
          gh release upload data out/meta.json --clobber
          if [ -f out/NOTICE-foursquare.txt ]; then gh release upload data out/NOTICE-foursquare.txt --clobber; fi
          # registr: nejdřív data, popis (registr.json) až po nich – aplikace tak nikdy nevidí popis bez dat;
          # na GitHubu zůstávají dvě poslední verze dat (aplikace, která zrovna stahuje starší, ji dostáhne)
          if [ -f out-registr/registr.json ] && ls out-registr/registr-*.bin >/dev/null 2>&1; then
            gh release upload data out-registr/registr-*.bin --clobber
            gh release upload data out-registr/registr.json --clobber
            gh release view data --json assets -q '.assets[].name' | grep '^registr-.*\.bin$' | sort -r | tail -n +3 | xargs -r -I{} gh release delete-asset data {} -y
          fi

      # zápis do repozitáře: GitHub jinak po 60 dnech bez změn naplánované spouštění vypne
      - name: Zapsat poslední běh
        if: ${{ !inputs.test }}
        run: |
          cp out/meta.json posledni.json
          if [ -f out-registr/registr.json ]; then cp out-registr/registr.json posledni-registr.json; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add posledni.json
          if [ -f posledni-registr.json ]; then git add posledni-registr.json; fi
          git commit -m "Prodejny $(date -u +%Y-%m-%d)" || echo "beze změny"
          git push

      - name: Zkouška – uložit balík do větve
        if: ${{ inputs.test }}
        run: |
          mkdir -p zkouska && cp out/prodejny.zip out/meta.json zkouska/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add zkouska
          git commit -m "Zkouška balíku $(date -u +%Y-%m-%d)" || echo "beze změny"
          git push

      # zkouška: registr se nezveřejní, jen se na 3 dny uloží k běhu (Actions → běh → Artifacts) – do repozitáře by byl moc velký
      - name: Zkouška – registr k běhu
        if: ${{ inputs.test }}
        uses: actions/upload-artifact@v4
        with:
          name: registr-zkouska
          path: out-registr/registr*
          retention-days: 3
          if-no-files-found: ignore
